# Render Blueprint: the API and its PostgreSQL database.
# The frontend is deployed separately (Netlify, see netlify.toml).
#
# Dashboard -> New -> Blueprint -> pick this repository. Render asks for the
# values marked `sync: false`; nothing secret is stored in this file.
#
# This file uses Render's FREE plans, for testing:
#  - a free web service sleeps when idle, which stops the background poller and
#    leaves gaps in history (the first request wakes it, and polling resumes)
#  - a free database is time-limited by Render and is deleted after that period
# For continuous data switch the two `plan:` lines below to paid plans (check
# Render's current plan names) and redeploy.
services:
  - type: web
    name: flightradar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    # Rebuild on every push to the connected branch (Settings -> Build & Deploy).
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flightradar-db
          property: connectionString
      # Render's database accepts TLS; set to "off" if the connection is refused.
      - key: DATABASE_SSL
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Exact origin of the deployed frontend, e.g. https://flightradar.netlify.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Frontend and API are on different sites, so the session cookie must be
      # sent cross-site (Secure is implied). Safari and some privacy modes block
      # such cookies: prefer custom domains under one parent domain (see
      # docs/DEPLOYMENT.md) and switch this to "lax".
      - key: COOKIE_SAMESITE
        value: none
      # One reverse proxy (Render's) sits in front of the API.
      - key: TRUST_PROXY_HOPS
        value: '1'

databases:
  - name: flightradar-db
    databaseName: flightradar
    user: flightradar
    plan: free
