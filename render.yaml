# Render Blueprint: the API and its PostgreSQL database.
# The frontend is deployed separately (Netlify, see netlify.toml).
#
# Dashboard -> New -> Blueprint -> pick this repository. Render asks for the
# values marked `sync: false`; nothing secret is stored in this file.
#
# Check current plan names and limits before relying on them:
#  - free web services sleep when idle, which stops the background poller and
#    leaves gaps in history; use a paid instance for continuous data
#  - free databases are time-limited by Render
services:
  - type: web
    name: flightradar-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flightradar-db
          property: connectionString
      # Render's database accepts TLS; set to "off" if the connection is refused.
      - key: DATABASE_SSL
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Exact origin of the deployed frontend, e.g. https://flightradar.netlify.app
      - key: FRONTEND_ORIGIN
        sync: false
      # Frontend and API are on different sites, so the session cookie must be
      # sent cross-site (Secure is implied). Safari and some privacy modes block
      # such cookies: prefer custom domains under one parent domain (see
      # docs/DEPLOYMENT.md) and switch this to "lax".
      - key: COOKIE_SAMESITE
        value: none
      # One reverse proxy (Render's) sits in front of the API.
      - key: TRUST_PROXY_HOPS
        value: '1'

databases:
  - name: flightradar-db
    databaseName: flightradar
    user: flightradar
    plan: basic-256mb
