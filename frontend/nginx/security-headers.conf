# Included in every location that sets its own headers (nginx does not inherit
# add_header into a location that declares one).
#
# CSP: scripts and styles only from this origin; the map needs workers from
# blob: and tiles/sprites/fonts from OpenFreeMap. Add the API origin to
# connect-src only if API_BASE_URL points at another host.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com https://tilecache.rainviewer.com https://t.plnspttrs.net; font-src 'self' data: https://tiles.openfreemap.org; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com https://tilecache.rainviewer.com https://api.open-meteo.com https://api.rainviewer.com https://api.planespotters.net https://metar.vatsim.net; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;
