<main class="wrap">
  <form class="card" (submit)="submit($event, email.value, password.value)" novalidate>
    <h1>Flight Radar India</h1>
    <p class="lead">Sign in to open the live dashboard.</p>

    <label for="email">Email</label>
    <input #email id="email" name="email" type="email" autocomplete="username" required autofocus />

    <label for="password">Password</label>
    <input #password id="password" name="password" type="password" autocomplete="current-password" required />

    @if (error(); as message) {
      <p class="error" role="alert" data-testid="login-error">{{ message }}</p>
    }

    <button type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
  </form>
</main>
