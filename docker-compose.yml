# Flight Radar India - containers.
#
#   Database only (local development):
#     docker compose up -d postgres
#
#   Whole app on one machine (API + web, plain HTTP on 127.0.0.1:8080):
#     cp .env.example .env      # then fill in the required values
#     docker compose --profile app up -d --build
#
#   Public server with automatic HTTPS (adds Caddy on ports 80/443):
#     docker compose --profile app --profile tls up -d --build
#
# Required variables are listed in .env.example; compose refuses to start
# without them rather than falling back to something insecure.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flightradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightradar}
      POSTGRES_DB: flightradar
    ports:
      # Bound to localhost only; the app reaches it over the compose network.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flightradar -d flightradar']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://flightradar:${POSTGRES_PASSWORD:-flightradar}@postgres:5432/flightradar
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env (at least 12 characters)}
      # The origin users type in the browser; the only one allowed by CORS.
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      # nginx (and Caddy, when used) sit in front, so client IPs arrive in X-Forwarded-For.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Empty = default (Secure in production). Set false only for plain-HTTP LAN testing.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-75}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    expose:
      - '3000'

  web:
    profiles: [app]
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_UPSTREAM: http://api:3000
      # Empty: the API is reached through this nginx on the same origin.
      API_BASE_URL: ''
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'

  # Public entry point with automatic HTTPS (Let's Encrypt). Needs DNS for
  # DOMAIN pointing at this machine and ports 80/443 open.
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. radar.example.com)}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
