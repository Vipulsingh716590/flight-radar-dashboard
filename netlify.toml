# Netlify: the Angular dashboard as a static site.
#
# The API address is set below (API_BASE_URL) and written into config.json at build time
# (frontend/scripts/write-config.mjs). A value in Netlify's UI would override it.

[build]
  base    = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "24"
  # Public address of the API (Render). Written into config.json at build time, so a
  # Git deploy needs no variable set in the Netlify UI. Change it if the API moves.
  API_BASE_URL = "https://flightradar-api.onrender.com"

# Single-page app: every unknown path serves index.html (deep links such as /airports/DEL).
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src must include the API origin; *.onrender.com covers Render's default host.
    # Replace it with your API host if you use a custom domain.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://s3.amazonaws.com; font-src 'self' data: https://tiles.openfreemap.org; connect-src 'self' https://*.onrender.com https://tiles.openfreemap.org https://s3.amazonaws.com; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/chunk-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/main-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
